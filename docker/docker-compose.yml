services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres_main_server
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pccontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: mainServ
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proxynet

networks:
  proxynet:
    name: custom_network

volumes:
  pgdata:
